{% extends "base.html" %}

{% block title %}注册 - 乐安博客{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>创建账号</h1>
    <p class="subtitle">加入乐安博客，开始写下你的第一篇</p>
    <form method="post" action="/register">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="给自己起个名字">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="设置密码">
        </div>
        <div class="form-group">
            <label for="password2">确认密码</label>
            <input type="password" id="password2" name="password2" placeholder="再输一次密码">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">注册</button>
            <a class="btn" href="/login">已有账号？去登录</a>
        </div>
    </form>
    <p class="notice">功能开发中：页面位置已经留好，等我们写完登录注册的后端就能真正使用了。</p>
</div>
{% endblock %}
