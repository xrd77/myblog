<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}乐安博客{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="/"><span>🎓</span> 乐安博客</a>
        <nav class="nav">
            <a href="/">首页</a>
            <a href="/posts">文章</a>
            <a href="/new">写文章</a>
            <a href="/about">关于</a>
        </nav>
        <div class="auth-links">
            {% if session.get("username") %}
                <span class="who">你好，{{ session.get("username") }}</span>
                <a class="btn btn-ghost" href="/logout">退出</a>
            {% else %}
                <a class="btn btn-ghost" href="/login">登录</a>
                <a class="btn btn-primary" href="/register">注册</a>
            {% endif %}
        </div>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <p>乐安博客 · 记录学习与生活的校园小站</p>
    </div>
</footer>
</body>
</html>
